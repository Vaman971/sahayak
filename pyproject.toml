[project]
name = "sahayak"
version = "0.1.0"
description = "Real-time code-mixed voice agent for insurance and EMI queries"
requires-python = ">=3.12"

[tool.uv]
package = false                      # the root is a workspace, not an installable package

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "hypothesis>=6.169.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib -q"
testpaths = ["packages", "services"]
filterwarnings = [
  "error",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]