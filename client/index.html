<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sahayak · echo test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    button { padding: 8px 16px; margin-right: 8px; }
    meter { width: 100%; }
    pre { background: #f4f4f4; padding: 12px; height: 240px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Sahayak · Step 2 echo test</h1>
  <p><strong>Wear headphones</strong>, or the speaker feeds back into the mic.</p>
  <button id="start">Start</button>
  <button id="stop" disabled>Stop</button>
  <p>Mic level <meter id="level" min="-60" max="0" value="-60"></meter></p>
  <p>WebSocket RTT: <span id="rtt">–</span> ms · playback underruns: <span id="underruns">0</span></p>
  <pre id="log"></pre>
  <script type="module" src="./app.js"></script>
</body>
</html>
